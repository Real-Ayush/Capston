<div class="register-shell d-flex align-items-center justify-content-center min-vh-100">

  <!-- Background -->
  <span class="geo geo-1"></span>
  <span class="geo geo-2"></span>
  <span class="geo geo-3"></span>

  <div class="register-card">

    <!-- Left Panel -->
    <div class="card-panel d-none d-md-flex flex-column justify-content-between">
      <div class="panel-logo">✦</div>

      <div class="panel-text">
        <p class="panel-quote">
          "Every great journey begins with a single step."
        </p>
        <span class="panel-line"></span>
        <p class="panel-sub">Join thousands of members today.</p>
      </div>

      <div class="panel-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form -->
    <div class="card-form p-4 p-lg-5">

      <!-- Header -->
      <div class="form-header mb-4">
        <span class="header-eyebrow">Create account</span>
        <h1 class="header-title">Start your journey</h1>
      </div>

      <!-- Success -->
      <div *ngIf="successMessage" class="msg-success mb-4">
        ✔ {{ successMessage }}
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage" class="msg-error mb-4">
        ⚠ {{ errorMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Username + Email -->
        <div class="row g-3 mb-3">

          <div class="col-12 col-sm-6">
            <label class="field-label">Username</label>
            <input class="f-input" formControlName="username" placeholder="johndoe">
          </div>

          <div class="col-12 col-sm-6">
            <label class="field-label">Email</label>
            <input class="f-input" formControlName="email" placeholder="john@email.com">
          </div>

        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="field-label">Password</label>
          <input type="password" class="f-input"
                 formControlName="password"
                 placeholder="Min 6 characters">

          <!-- Strength -->
          <div class="strength-bar mt-2"
               *ngIf="registerForm.get('password')?.value">
            <span class="s-seg" [class.active]="registerForm.get('password')!.value.length >= 1"></span>
            <span class="s-seg" [class.active]="registerForm.get('password')!.value.length >= 4"></span>
            <span class="s-seg" [class.active]="registerForm.get('password')!.value.length >= 6"></span>
            <span class="s-seg" [class.active]="registerForm.get('password')!.value.length >= 9"></span>
          </div>
        </div>

        <!-- Role -->
        <div class="mb-4">
          <label class="field-label">Account type</label>

          <div class="role-group d-flex gap-2">

            <label class="role-chip"
              [class.selected]="registerForm.get('role')?.value === 'CUSTOMER'">
              <input type="radio" formControlName="role" value="CUSTOMER" hidden>
              👤 Customer
            </label>

            <label class="role-chip"
              [class.selected]="registerForm.get('role')?.value === 'RESTAURANT'">
              <input type="radio" formControlName="role" value="RESTAURANT" hidden>
              🧑‍💼 Manager
            </label>

            <label class="role-chip"
              [class.selected]="registerForm.get('role')?.value === 'DRIVER'">
              <input type="radio" formControlName="role" value="DRIVER" hidden>
              🛵 Driver
            </label>

          </div>
        </div>

        <!-- ✅ OTP FIELD -->
        <div class="mb-3" *ngIf="otpSent">
          <label class="field-label">Enter OTP</label>

          <input
            type="text"
            class="f-input"
            placeholder="Enter 6-digit OTP"
            [(ngModel)]="otp"
            name="otp"
          >
        </div>

        <!-- ✅ SUBMIT BUTTON -->
        <button type="submit" class="btn-register w-100" [disabled]="loading">

          <!-- Step 1 -->
          <span *ngIf="!loading && !otpSent">
            Send OTP →
          </span>

          <!-- Step 2 -->
          <span *ngIf="!loading && otpSent">
            Verify & Register →
          </span>

          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>

        </button>

      </form>

      <!-- Footer -->
      <p class="mt-4 text-center footer-note">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>

    </div>
  </div>
</div>
